services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/ascend?schema=public"
      AUTH_SECRET: "codespaces-dev-secret-not-for-production-000000000000"
      NODE_ENV: "development"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ascend
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
